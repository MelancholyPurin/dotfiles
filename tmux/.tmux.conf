# Purin's Tmux Config

# Catpuccin Theme
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_date_time_text " %a %d-%m-%Y %H:%M"

# Set Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-weather'

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Load Catppuccin Theme
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status Bar Config

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -gF status-right "##{E:@catppuccin_status_session}#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_battery}##{E:@catppuccin_status_date_time}"

# General Settings
set -g mouse on
set -g history-limit 50000 # Increase scrollback
set -g renumber-windows on
set -g set-clipboard on
set -g base-index 1 
setw -g pane-base-index 1
set -g display-time 4000 # Set message display time to 4 seconds
set -g allow-rename off
setw -g aggressive-resize on # Adjust pane sizes dynamically
set -g status-interval 5 # Refresh status bar more often

# Keybinds
bind r source-file ~/.tmux.conf
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -r p previous-window
bind -r n next-window

bind -r "<" swap-window -d -t -1 # Move current window to the left
bind -r ">" swap-window -d -t +1 # Move current window to the right

# Load plugins
run '~/.tmux/plugins/tpm/tpm'